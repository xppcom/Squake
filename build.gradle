plugins {
    id 'com.gtnewhorizons.gtnhconvention'
}

group = project.modGroup

ext.modVersion = providers.gradleProperty('modVersion').get()
version = ext.modVersion

sourceSets {
    main {
        java {
            srcDirs = ['java', 'apis']
        }
        resources {
            srcDirs = ['resources']
        }
    }
}
