name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: '${{ github.event.ref }}'
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - run: ./gradlew -D 'org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_25_X64' build
      - env:
          GITHUB_TOKEN: '${{ github.token }}'
        run: |
          TAG="${GITHUB_REF_NAME}"
          JAR="build/libs/Squake-${TAG#v}.jar"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" --title "Squake ${TAG#v}" --notes "Hard speed cap at 200 km/h (1 block = 1 meter)." "$JAR"
          fi
